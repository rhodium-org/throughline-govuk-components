uid: UR-0035
type: user_requirement
status: approved
title: Generic header
text: As a service, I use the Generic header component to tell users they are using
  a government service that is not part of the GOV.UK website.
rationale: Signals to users that a public-facing government service sits outside the
  GOV.UK website, maintaining trust and consistency across journeys while ensuring
  non-GOV.UK services do not misuse GOV.UK branding.
