uid: UR-0017
type: user_requirement
status: approved
title: Inset text
text: The inset text component differentiates a block of text from the surrounding
  content, such as quotes, examples or additional information.
rationale: So a block of supporting text like a quote, example or extra note is visually
  differentiated from surrounding content, used sparingly since it is not reliable
  enough for very important information.
