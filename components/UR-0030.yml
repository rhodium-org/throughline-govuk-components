uid: UR-0030
type: user_requirement
status: approved
title: Tag
text: As a service, I use the Tag component to show users the status of something,
  such as an item on a task list or a phase banner.
rationale: Lets users see at a glance the current status of something that can hold
  more than one state, such as whether a task-list item is completed or a user is
  active, so they know where things stand without reading further.
