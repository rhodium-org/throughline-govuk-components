uid: UR-0003
type: user_requirement
status: approved
title: Date input
text: The service uses the GOV.UK Date input component to help users enter a memorable
  date across day, month and year fields, grouped in a fieldset, with accessible labelling,
  autocomplete and specific error messages.
rationale: Users entering a date they already know or can look up need to type the
  day, month and year directly, avoiding the friction of a calendar picker for dates
  that are memorable rather than chosen.
