uid: UR-0002
type: user_requirement
status: approved
title: Error summary
text: The service uses the GOV.UK Error summary component at the top of a page to
  summarise validation errors, moving focus to it, linking each error to its answer
  and mirroring the inline error messages.
rationale: When a user submits answers containing validation errors, they need every
  problem gathered and focused at the top of the page so they can find, understand,
  and fix each mistake rather than hunting for what went wrong.
