uid: UR-0018
type: user_requirement
status: approved
title: Notification banner
text: A notification banner tells the user about something they need to know that
  is not directly related to the page content, and a service uses it for service-wide
  problems, personal alerts, or the outcome of a completed action.
rationale: Alerts users to something they need to know but that is not directly tied
  to the current task, such as a service-wide problem, an approaching deadline, or
  the outcome of a prior action, without cluttering the main content.
