uid: UR-0001
type: user_requirement
status: approved
title: Button
text: The service uses the GOV.UK Button component to let users carry out an action,
  following its guidance on button text, variants, grouping, contrast and double-click
  prevention.
rationale: Users need an unambiguous, prominent way to carry out an action such as
  starting an application, signing in, or paying, so the main call to action stands
  out and they always know what to do next.
