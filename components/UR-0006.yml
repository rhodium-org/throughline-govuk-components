uid: UR-0006
type: user_requirement
status: approved
title: Breadcrumbs
text: The service uses the GOV.UK Breadcrumbs component to help users understand where
  they are within a site's hierarchy and move between levels, placed above the main
  content.
rationale: Users navigating a site with multiple hierarchical levels need to understand
  where they are and move up between levels, so they can orient themselves within
  the wider structure.
