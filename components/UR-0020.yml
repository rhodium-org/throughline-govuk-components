uid: UR-0020
type: user_requirement
status: approved
title: Panel
text: The panel component is a visible container used on confirmation or results pages
  to highlight important content, and a service uses it to confirm a completed transaction.
rationale: Highlights that a transaction has been completed successfully on a confirmation
  or results page, giving users clear high-level reassurance and any reference they
  need once they finish.
