uid: UR-0016
type: user_requirement
status: approved
title: GOV.UK header
text: The GOV.UK header tells users they are using a service on GOV.UK and gives access
  to GOV.UK-wide tools.
rationale: So users trust they are in the right place on an official gov.uk service
  as they move around government websites, giving a consistent GOV.UK experience and
  access to GOV.UK-wide tools.
