uid: UR-0021
type: user_requirement
status: approved
title: Password input
text: The password input component helps users accessibly create and enter passwords,
  with an option to show what they have entered as plain text, and a service uses
  it whenever a password must be created or entered.
rationale: Helps users create and enter passwords accessibly, letting them reveal
  what they typed to reduce errors and choose stronger, more unique passwords before
  submitting.
