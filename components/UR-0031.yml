uid: UR-0031
type: user_requirement
status: approved
title: Task list
text: As a service, I use the task list component to display all the tasks a user
  needs to do and let them see which are done and which remain.
rationale: Gives users control over long, complex services they cannot or do not want
  to finish in one sitting, letting them choose their own order and clearly see which
  tasks are done and which remain.
