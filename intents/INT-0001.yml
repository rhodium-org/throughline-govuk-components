uid: INT-0001
type: intent
status: deleted
title: GOV.UK services are consistent, accessible and usable by everyone
text: The GOV.UK Design System exists so that government services are built from
  components and patterns that are proven to be consistent, accessible and usable
  — letting teams reuse tested solutions with documented usage and accessibility
  guidance rather than reinventing interface elements service by service.
normative: false
