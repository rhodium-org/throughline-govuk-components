uid: SR-0034
type: system_requirement
status: approved
title: Set autocomplete attributes for a date of birth
text: When asking for a date of birth, set the autocomplete attribute on the three
  fields to bday-day, bday-month and bday-year so browsers can autofill a previously
  entered value.
