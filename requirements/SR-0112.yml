uid: SR-0112
type: system_requirement
status: approved
title: Write in plain, positive English
text: Describe what happened and how to fix it in plain, positive English; avoid technical
  jargon, words like 'forbidden', 'illegal' or 'you forgot', and 'please', 'sorry',
  'valid', 'invalid' or humorous language.
